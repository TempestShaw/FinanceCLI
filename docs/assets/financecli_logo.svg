<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="1200" rx="56" fill="#FBFCFE"/>

  <!-- subtle grounding -->
  <ellipse cx="600" cy="760" rx="330" ry="28" fill="#E9EEF3"/>

  <!-- terminal body -->
  <rect x="245" y="270" width="610" height="430" rx="64" fill="#16232D"/>
  <rect x="245" y="270" width="610" height="82" rx="64" fill="#22343F"/>
  <rect x="245" y="320" width="610" height="32" fill="#22343F"/>
  <circle cx="300" cy="311" r="12" fill="#FF766D"/>
  <circle cx="337" cy="311" r="12" fill="#F7C85D"/>
  <circle cx="374" cy="311" r="12" fill="#54C89B"/>

  <!-- terminal prompt -->
  <path d="M330 440 L398 502 L330 564" fill="none" stroke="#58D7A2" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="427" y="548" width="130" height="28" rx="14" fill="#DDE6EC"/>

  <!-- market signal, deliberately secondary -->
  <line x1="595" y1="488" x2="595" y2="560" stroke="#6E8F9F" stroke-width="12" stroke-linecap="round"/>
  <rect x="578" y="504" width="34" height="38" rx="7" fill="#6E8F9F"/>
  <line x1="650" y1="448" x2="650" y2="548" stroke="#58D7A2" stroke-width="12" stroke-linecap="round"/>
  <rect x="633" y="469" width="34" height="52" rx="7" fill="#58D7A2"/>
  <line x1="705" y1="465" x2="705" y2="566" stroke="#7FA9BD" stroke-width="12" stroke-linecap="round"/>
  <rect x="688" y="495" width="34" height="46" rx="7" fill="#7FA9BD"/>

  <!-- research document card -->
  <g transform="translate(665 390)">
    <rect x="0" y="0" width="265" height="340" rx="38" fill="#FFFFFF" stroke="#D7E0E7" stroke-width="8"/>
    <path d="M185 0 L265 80 L205 80 C194 80 185 71 185 60 Z" fill="#EAF2F6"/>
    <rect x="46" y="98" width="120" height="18" rx="9" fill="#2E4958"/>
    <rect x="46" y="145" width="164" height="14" rx="7" fill="#B4C5CE"/>
    <rect x="46" y="180" width="142" height="14" rx="7" fill="#C8D5DC"/>
    <rect x="46" y="215" width="155" height="14" rx="7" fill="#C8D5DC"/>

    <!-- verified evidence -->
    <circle cx="185" cy="276" r="49" fill="#58D7A2"/>
    <path d="M162 277 L179 294 L211 256" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- evidence/source nodes -->
  <circle cx="811" cy="374" r="16" fill="#58D7A2"/>
  <circle cx="858" cy="344" r="11" fill="#7FA9BD"/>
  <circle cx="900" cy="365" r="8" fill="#B4C5CE"/>
  <path d="M812 374 C835 357 847 349 859 344 C876 350 886 358 900 365" fill="none" stroke="#B7C8D0" stroke-width="7" stroke-linecap="round"/>

  <!-- title -->
  <text x="600" y="895" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="106" font-weight="800" letter-spacing="-4">
    <tspan fill="#182833">Finance</tspan><tspan fill="#43BE8B">CLI</tspan>
  </text>

  <!-- tagline -->
  <text x="600" y="972" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="28" font-weight="650" letter-spacing="9" fill="#6C7F8A">
    RESEARCH · EVIDENCE · CALCULATE
  </text>
</svg>